<!DOCTYPE html>
<html>
<head>
  <title>Security Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .bar {
      width: 100%;
      background-color: #1a73e8;
      text-align: center;
      padding: 20px 0;
      box-sizing: border-box;
    }

    #welcomeMessage{ 
      text-align:center; 
      font-size:20px; 
      margin-top:200px; 
      color:#333
    }

    #chatBox {
      display: none;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .message {
      clear: both;
      margin: 10px 0;
      white-space: normal;
    }
    .message p { 
      margin: 0.5em 0; 
    }

    .message ol, .message ul {
      margin: 0.5em 0 0.5em 1.5em;
    }

    .user {
      float: right;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .bot {
      float: left;
      background: #f1f3f4;
      color: #111;
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

   #inputSection {
      display: flex;
      align-items: stretch;
      max-width: 600px;
      margin: 20px auto;
      gap: 10px;
      height: 20px;
      padding: 10px;
    }

    #send-btn {
      font-size: 20px;
      padding: 10px 16px;
      height: 41px;
      border: none;
      background: #1a73e8;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #send-btn:hover {
      background: #1558c0;
    }

    #send-btn2:hover {
      background: #1558c0;
    }

    .editable-input {
  flex: 1;
  height: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.9rem;
  overflow-y: auto;
}

    .editable-input:empty:before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
      display: block;
      white-space: nowrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #1a73e8;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #faqSection {
      max-width: 600px;
      margin: 20px auto;
      text-align: center;
    }

    #faqSection button {
      margin: 5px;
      padding: 10px;
      background: #1a73e8;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      line-height: 20px;
      background-color: #1a73e8;
      color: #ffffff;
      font-size: 0.8rem;
      text-align: center;
      border-top: 1px solid #ddd;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="bar"></div>

  <div id="welcomeMessage">
        Hello, what's on your mind?
  </div>

  <div id="chatBox"></div>

  <div id="inputSection">
    <div
      id="queryInput"
      class="editable-input"
      contenteditable="true"
      data-placeholder="Type here…"
    ></div >

    <button id="send-btn" onclick="sendQuery()"> ➢ </button>

  </div>
  
  <div id="faqSection">
    <button id="send-btn2" onclick="startEmailScan()"> + Add Email File</button>
    <button id="send-btn2" onclick="openIncidentForm()"> + Generate Incident Report</button>
  </div>

  <input type="file" id="emlFileInput" accept=".eml" style="display:none" />

  <div class="footer">
    Powered by Suliat Kazeem - The Official Person who created the SME Chatbot for Rxtra Healthcare Limited<br>
                    © Copyright 2025 COMP8870
  </div>

  <script>
    window.onload = function () {

    let sessionId = crypto.randomUUID();

    const chatBox  = document.getElementById("chatBox");
    const inputDiv = document.getElementById("queryInput");

    inputDiv.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
      }
    });

    const fileIn   = document.getElementById("emlFileInput");


    window.sendQuery = async function () {
      const query = inputDiv.innerText.trim();
      if (!query) return;

      document.getElementById("welcomeMessage").style.display = "none";

      chatBox.style.display = "block";
      addMessage("user", query);

      inputDiv.innerText = "";

      const resp = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ query, session_id: sessionId })
      });

      const text = await resp.text();
      addMessage("bot", text);
    };


    window.openIncidentForm = function () {
    window.location.href = "/incident_form.html";
  };

  window.startEmailScan = function () {
    chatBox.style.display = "block";
    fileIn.click();
  };

    fileIn.addEventListener("change", async () => {
      const file = fileIn.files[0];
      if (!file) return;

      addMessage("user", `Uploading ${file.name} for scan…`);

      const form = new FormData();
      form.append("email_file", file);

      try {
        const resp = await fetch("/scan-email-file", {
          method: "POST",
          body: form
        });

        const text = await resp.text();
        addMessage("bot", text);
      } 
      catch {
        addMessage("bot", "Error scanning that email file.");
      } 
        fileIn.value = "";
      
    });

    function addMessage(sender, text) {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.innerHTML = marked.parse(text);

      if (text.includes("[YES_INCIDENT]")) {

      div.innerHTML = div.innerHTML.replace(
        "[YES_INCIDENT]",
        `
          <button onclick="startAutoIncident()">Yes</button>
          <button onclick="cancelAutoIncident()">No</button>
        `
      );
       }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    };
  </script>

</body>
</html>
