<!DOCTYPE html>
<html>
<head>
  <title>Create Incident</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea, select {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
    }

    button {
      background: #1a73e8;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Create an Incident</h2>

  <p> * Indicates required</p>

  <label for="Title">* Short Description (Summary)</label>
  <input id="Title" placeholder="Incident Summary" />

  <label for="Description">* Please describe details of your issue:</label>
  <textarea id="Description" placeholder="Include details as the name of the affected service, relevant logs, or error messages that can provide context"></textarea>

  <button onclick="submitIncident()">Submit Incident</button>
</div>

<script>
async function submitIncident() {
  const payload = {
    title: document.getElementById("Title").value.trim(),
    description: document.getElementById("Description").value.trim()
  };

  if (!payload.title || !payload.description) {
    alert("Please complete all required fields.");
    return;
  }

  const res = await fetch("/incidents", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  localStorage.setItem("incident_message", data.message);
window.location.href = "/";
}
</script>

</body>
</html>
